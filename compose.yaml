services:
  db:
    image: mysql:8.0.46
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-portal_empleo_inclusivo}
      MYSQL_USER: ${MYSQL_USER:-incluyelab_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-incluyelab_local_demo}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-incluyelab_root_local_demo}
      TZ: America/Lima
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/portal_empleo_inclusivo.sql:/docker-entrypoint-initdb.d/01-portal.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 25s

  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-portal_empleo_inclusivo}?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
      DB_USER: ${MYSQL_USER:-incluyelab_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-incluyelab_local_demo}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_AUTH: "false"
      MAIL_STARTTLS: "false"
      MAIL_FROM: ${MAIL_FROM:-no-reply@incluyelab.local}
      CATALINA_OPTS: -Duser.home=/var/lib/incluyelab -Dfile.encoding=UTF-8
      TZ: America/Lima
    ports:
      - "${APP_PORT:-8084}:8080"
    volumes:
      - incluyelab_data:/var/lib/incluyelab/IncluyeLab

volumes:
  mysql_data:
  incluyelab_data:
